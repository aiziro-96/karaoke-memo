<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎤 カラオケ曲メモ</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app">
        <h1>🎤 カラオケ曲メモ</h1>
        <!-- 説明文 -->
        <section class="description">
            <p>好きな曲がカラオケに入っているかメモできます</p>
        </section>

        <!-- 検索エリア -->
        <form class="search-area" name="search" method="get">
            <input type="text" placeholder="曲名・アーティスト名" class="search-input" name="search">
            <button class="search-button">検索</button>
            <p>検索ワード：{{ search_word }}</p>
        </form>

        <section class="filter-area">
            <p>フィルター:</p>

            <a href="/" class="filter-button">すべて</a>

            <a href="/?filter=joysound" class="filter-button">JOYSOUND</a>

            <a href="/?filter=dam" class="filter-button">DAM</a>

            <a href="/?filter=favorite" class="filter-button {% if filter_type == 'favorite' %}active{% endif %}">お気に入り</a>
        </section>

        <!-- 曲追加エリア -->
        <section class="add-area">
            <form action="/" method="post">
                <input type="text" placeholder="曲名" name="song_title" required>
                <input type="text" placeholder="アーティスト名" name="artist" required>
                <div class="checkbox-group">
                    <input type="checkbox" id="joysound" name="joysound">
                    <label for="joysound">JOYSOUND</label>
                    <input type="checkbox" id="dam" name="dam">
                    <label for="dam">DAM</label>
                    <input type="checkbox" id="favorite" name="favorite">
                    <label for="favorite">お気に入り</label>
                </div>
                <button class="add-button">曲を追加</button>
            </form>
        </section>

        <!-- 曲カード一覧 -->
   
        <section class="song-list">
            {% if songs %}
                {% for song in songs %}
                <article class="song-card">
                    <h2>{{ song.title }}</h2>
                    <p class="artist">{{ song.artist }}</p>
                    
                    <div class="tag-button">
                        {% if song.joysound %}
                            <span class="tag-joysound">JOYSOUND</span>
                        {% endif %}
                        {% if song.dam %}
                            <span class="tag-dam">DAM</span>
                        {% endif %}
                        <form method="post">
                            <!-- どの曲か -->
                            <input type="hidden" name="song_id" value="{{ song.id }}">
                            <!-- 何の操作か -->
                            <input type="hidden" name="action" value="toggle_favorite">
                            <!-- ボタン -->
                            <button type="submit" class="favorite-button">
                                {% if song.favorite %}
                                    ★
                                {% else %}
                                    ☆
                                {% endif %}
                            </button>
                        </form>
                        <form action="" method="post">
                            <input type="hidden" name="song_id" value="{{ song.id }}">
                            <button class="delete-button" type="submit">削除</button>
                        </form>
                    </div>
                </article>
                {% endfor %}
            {% else %}
                <p class="no-result">該当する曲が見つかりません。</p>
            {% endif %}


                </div>
            </article>
        </section>
    </div>
</body>
</html>
