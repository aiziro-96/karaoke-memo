<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎤 カラオケ曲メモ</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app">
        <h1>🎤 カラオケ曲メモ</h1>
        <!-- 説明文 -->
        <section class="description">
            <p>好きな曲がカラオケに入っているかメモできます</p>
        </section>

        <!-- 検索エリア -->
        <form class="search-area">
            <input type="text" placeholder="曲名・アーティスト名" class="search-input">
            <button class="search-button">検索</button>
        </form>

        <!-- フィルター -->
        <section class="filter-area">
            <p>フィルター:</p>
            <button class="filter-button">すべて</button>
            <button class="filter-button">JOYSOUND</button>
            <button class="filter-button">DAM</button>
            <button class="filter-button active">お気に入り</button>
        </section>

        <!-- 曲カード一覧 -->
        <section class="song-list">
            <article class="song-card">
                <h2>怪物</h2>
                <p class="artist">YOASOBI</p>
                <div class="tag-button">
                    <span class="tag-joysound">JOYSOUND</span>
                    <span class="tag-dam">DAM</span>
                    <button class="favorite-button">★</button>
                </div>
            </article>

            <article class="song-card">
                <h2>夜に駆ける</h2>
                <p class="artist">YOASOBI</p>
                <div class="tag-button">
                    <span class="tag-joysound">JOYSOUND</span>
                    <span class="tag-dam">DAM</span>
                    <button class="favorite-button">★</button>
                </div>
            </article>

            <article class="song-card">
                <h2>群青</h2>
                <p class="artist">YOASOBI</p>
                <div class="tag-button">
                    <span class="tag-joysound">JOYSOUND</span>
                    <span class="tag-dam">DAM</span>
                    <button class="favorite-button">★</button>
                </div>
            </article>
        </section>
    </div>
</body>
</html>
